basePath: /
definitions:
  Detail:
    properties:
      detail:
        description: Detail is a human-readable explanation specific to this occurrence.
        type: string
      instance:
        description: Instance is a URI identifying the specific occurrence of the
          problem.
        type: string
      requestId:
        description: RequestID correlates the problem to a specific request.
        type: string
      status:
        description: Status is the HTTP status code for this occurrence.
        type: integer
      timestamp:
        description: Timestamp records when the problem was created.
        type: string
      title:
        description: |-
          Title is a short, human-readable summary of the problem type.
          Should not change across occurrences of the same problem.
        type: string
      type:
        description: |-
          Type is a URI identifying the problem type. Should provide
          developer-readable documentation.
        type: string
    type: object
  NetworkInterface:
    properties:
      mac:
        type: string
      name:
        description: e.g. "eth0", "en0"
        type: string
      physical_id:
        type: string
      private_ip:
        type: string
      public_ip:
        type: string
      service_port:
        type: integer
      subnet_cidr:
        type: string
    type: object
  Node:
    properties:
      addr:
        description: |-
          Gossip address: interface IPs may be unreachable from peers (VPN
          tunnels) or shared by several hosts (VM bridges).
        type: string
      healthy:
        type: boolean
      id:
        type: string
      interfaces:
        items:
          $ref: '#/definitions/NetworkInterface'
        type: array
      last_seen:
        type: string
      started_at:
        type: string
      version:
        description: binary version (git tag or short commit), injected at build time
        type: string
    type: object
  ProxyInfo:
    properties:
      address:
        type: string
      node_id:
        type: string
    type: object
  resolvedNode:
    properties:
      address:
        example: 192.168.100.158:3128
        type: string
      node_id:
        example: zero1
        type: string
    type: object
info:
  contact:
    name: Norlis Viamonte
  description: 'Control plane of Hydra, a self-clustering HTTP forward proxy mesh:
    cluster topology, entity-to-node resolution, live cluster events and health probes.'
  termsOfService: http://swagger.io/terms/
  title: hydra
paths:
  /api/events:
    get:
      description: Real-time stream of cluster membership events (node.joined, node.left,
        node.updated) via Server-Sent Events.
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of events
          schema:
            type: string
        "500":
          description: Streaming unsupported
          schema:
            type: string
      summary: SSE Cluster Events
      tags:
      - topology
  /api/nodes:
    get:
      consumes:
      - application/json
      description: list of cluster nodes (local + active peers)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Node'
            type: array
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/Detail'
      summary: Nodes
      tags:
      - topology
  /api/proxies:
    get:
      consumes:
      - application/json
      description: list of all proxy addresses in the cluster
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ProxyInfo'
            type: array
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/Detail'
      summary: Proxies
      tags:
      - topology
  /api/proxies/test:
    get:
      description: |-
        Checks if a proxy address is operational by routing a request through it.
        The target defaults to https://checkip.amazonaws.com (returns the egress IP).
        Note: requires outbound internet access; will fail in air-gapped networks.
        The proxy must be a member of this mesh (see /api/proxies) and
        the target is subject to the same egress policy as the data plane.
      parameters:
      - description: Proxy address (host:port, e.g. 192.168.1.10:3128)
        in: query
        name: address
        required: true
        type: string
      - description: 'Target URL to fetch through the proxy (default: https://checkip.amazonaws.com/)'
        in: query
        name: target
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Malformed address or target
          schema:
            $ref: '#/definitions/Detail'
        "403":
          description: Address outside the mesh or target denied by egress policy
          schema:
            $ref: '#/definitions/Detail'
      summary: Test a proxy
      tags:
      - topology
  /api/resolve:
    post:
      consumes:
      - application/json
      description: |-
        Maps each entity id to the node that owns it on the consistent-hash ring.
        Input is a JSON array of strings; empty and duplicate ids are dropped.
        Values are hashed verbatim (no trim/lowercase) to match live routing.
      parameters:
      - description: Entity ids to resolve
        in: body
        name: ids
        required: true
        schema:
          example: '["entity-1","entity-2"]'
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/resolvedNode'
            type: object
        "400":
          description: Invalid body or too many ids
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Ring not converged
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resolve entity ids to nodes
      tags:
      - topology
swagger: "2.0"
