<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra Mesh - Topology</title>

    <!-- Tailwind via Play CDN: works without a build step.
         When you regenerate /assets/css/output.css with your build, swap this back. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.2/sse.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        body {
            background-color: #0a0a0a;
            background-image:
                    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.08), transparent),
                    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px, 32px 32px;
        }

        .node-card {
            position: relative;
            background: linear-gradient(180deg, rgba(31, 41, 55, 0.4) 0%, rgba(17, 24, 39, 0.6) 100%);
        }
        .node-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 0.75rem;
            padding: 1px;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .node-card.unhealthy::before {
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.5), rgba(239, 68, 68, 0.05));
        }
        .node-card.neutral::before {
            background: linear-gradient(180deg, rgba(75, 85, 99, 0.5), rgba(75, 85, 99, 0.1));
        }

        @keyframes live-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50%      { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); }
        }
        .live-dot { animation: live-pulse 2s infinite; }
    </style>
</head>
<body class="min-h-screen text-gray-200 font-mono">

<div hx-ext="sse" sse-connect="/api/events" hx-swap="none">
    <div sse-swap="node.joined"></div>
    <div sse-swap="node.updated"></div>
    <div sse-swap="node.left"></div>
</div>

<div class="container mx-auto max-w-7xl p-4 sm:p-6" x-data>

    <!-- ============ HEADER ============ -->
    <header class="flex items-center justify-between gap-4 mb-6 px-5 py-3 rounded-xl bg-gray-900/40 border border-gray-800 backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold tracking-wide text-emerald-400">Hydra Mesh</h1>
            <div class="w-px h-6 bg-gray-700"></div>
            <div class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold tracking-wider">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 live-dot"></div>
                LIVE
            </div>
        </div>

        <!-- Client ID badge -->
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-900/60 border border-gray-800 text-xs">
            <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2a4 4 0 014-4h4m-4-4V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h6m4-10h6a2 2 0 012 2v6a2 2 0 01-2 2h-6a2 2 0 01-2-2v-6a2 2 0 012-2z"/>
            </svg>
            <span class="text-gray-500">Client:</span>
            <span class="text-gray-200">{{ .ClientID }}</span>
        </div>
    </header>

    <!-- ============ NODES PANEL (full width) ============ -->
    <section class="bg-gray-900/30 border border-gray-800 rounded-xl p-5 backdrop-blur-sm">

        <div class="flex items-center gap-1 mb-6 border-b border-gray-800">
            <button @click="$store.cluster.activeTab = 'nodes'"
                    :class="$store.cluster.activeTab === 'nodes'
                        ? 'text-emerald-400 border-emerald-400'
                        : 'text-gray-500 border-transparent hover:text-gray-300'"
                    class="px-4 py-2.5 text-sm font-semibold border-b-2 -mb-px transition-colors flex items-center gap-2">
                Nodes
                <span class="bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded text-[10px]"
                      x-text="$store.cluster.nodesList.length"></span>
            </button>
            <button @click="$store.cluster.activeTab = 'proxies'"
                    :class="$store.cluster.activeTab === 'proxies'
                        ? 'text-emerald-400 border-emerald-400'
                        : 'text-gray-500 border-transparent hover:text-gray-300'"
                    class="px-4 py-2.5 text-sm font-semibold border-b-2 -mb-px transition-colors">
                Proxies
            </button>
        </div>

        <div x-show="$store.cluster.activeTab === 'nodes'" x-transition
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

            <template x-for="node in $store.cluster.nodesList" :key="node.id">
                <div class="node-card relative rounded-xl p-4 transition-all duration-300 hover:-translate-y-0.5"
                     :class="{ 'unhealthy': node.healthy === false, 'neutral': node.healthy === null || node.healthy === undefined }">

                    <div class="flex items-center gap-2 mb-2 text-xs"
                         x-show="node.healthy !== null && node.healthy !== undefined">
                        <div class="w-1.5 h-1.5 rounded-full"
                             :class="node.healthy ? 'bg-emerald-400' : 'bg-red-400'"></div>
                        <span :class="node.healthy ? 'text-emerald-400' : 'text-red-400'"
                              x-text="node.healthy ? 'Healthy' : 'Unhealthy'"></span>
                    </div>

                    <h3 class="text-lg font-bold text-gray-100 mb-3" x-text="node.id"></h3>

                    <div class="space-y-1 text-xs text-gray-400 mb-3">
                        <div>IP: <span class="text-gray-200" x-text="$store.cluster.getPrimaryIP(node)"></span></div>
                        <div>Port: <span class="text-gray-200" x-text="$store.cluster.getPrimaryPort(node)"></span></div>
                        <div>Uptime: <span class="text-gray-200" x-text="$store.cluster.formatUptime(node.last_seen)"></span></div>
                    </div>

                    <div class="flex flex-wrap gap-1.5" x-show="node.tags && Object.keys(node.tags).length > 0">
                        <template x-for="(value, key) in (node.tags || {})" :key="key">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase border"
                                  :class="key === 'zone'
                                      ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30'
                                      : 'bg-sky-500/10 text-sky-300 border-sky-500/30'">
                                <span x-text="key.toUpperCase() + ': ' + String(value).toUpperCase()"></span>
                            </span>
                        </template>
                    </div>
                </div>
            </template>

            <div x-show="$store.cluster.nodesList.length === 0" x-cloak
                 class="col-span-full text-center py-16 border border-dashed border-gray-800 rounded-xl text-gray-600 text-sm">
                Waiting for nodes to join the cluster...
            </div>
        </div>

        <div x-show="$store.cluster.activeTab === 'proxies'" x-cloak x-transition
             class="text-center py-16 text-gray-600 text-sm">
            Proxies view — coming soon.
        </div>
    </section>

    <footer class="text-center mt-10 text-[10px] text-gray-700">
        © 2026 Hydra Mesh Project.
    </footer>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('cluster', {
            activeTab: 'nodes',
            nodesMap: {},
            now: Date.now(),

            async init() {
                try {
                    const response = await fetch('/api/nodes');
                    if (response.ok) {
                        const data = await response.json();
                        const newMap = {};
                        data.forEach(node => newMap[node.id] = node);
                        this.nodesMap = newMap;
                    }
                } catch (err) {
                    console.error("Failed to load initial nodes:", err);
                }
                setInterval(() => { this.now = Date.now(); }, 1000);
            },

            get nodesList() {
                return Object.values(this.nodesMap).sort((a, b) => a.id.localeCompare(b.id));
            },

            upsertNode(node) {
                this.nodesMap = { ...this.nodesMap, [node.id]: node };
            },

            removeNode(nodeId) {
                const newMap = { ...this.nodesMap };
                delete newMap[nodeId];
                this.nodesMap = newMap;
            },

            formatUptime(timestamp) {
                if (!timestamp) return '—';
                const secs = Math.floor((this.now - new Date(timestamp).getTime()) / 1000);
                if (secs < 0)  return '0s';
                if (secs < 60) return `${secs}s`;
                const m = Math.floor(secs / 60), s = secs % 60;
                if (m < 60)    return `${m}m ${String(s).padStart(2, '0')}s`;
                const h = Math.floor(m / 60), mm = m % 60;
                return `${h}h ${String(mm).padStart(2, '0')}m`;
            },

            getPrimaryIP(node) {
                if (node.interfaces && node.interfaces.length > 0) {
                    return node.interfaces[0].private_ip || 'N/A';
                }
                return 'No IP bound';
            },

            getPrimaryPort(node) {
                if (node.interfaces && node.interfaces.length > 0) {
                    return node.interfaces[0].service_port || '—';
                }
                return '—';
            }
        });
    });

    document.body.addEventListener('htmx:sseMessage', function (e) {
        const eventType = e.detail.type;
        if (!eventType || eventType === 'message') return;

        try {
            const nodeData = JSON.parse(e.detail.data);
            const store = Alpine.store('cluster');

            if (eventType === 'node.joined' || eventType === 'node.updated') {
                store.upsertNode(nodeData);
            } else if (eventType === 'node.left') {
                store.removeNode(nodeData.id);
            }
        } catch (err) {
            console.error("Error parsing SSE data:", err);
        }
    });
</script>

</body>
</html>
