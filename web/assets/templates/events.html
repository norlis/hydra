<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra Mesh - Topology</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.2/sse.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        body {
            background-color: #0a0a0a;
            background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.08), transparent),
            linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px, 32px 32px;
        }

        .node-card {
            position: relative;
            background: linear-gradient(180deg, rgba(31, 41, 55, 0.4) 0%, rgba(17, 24, 39, 0.6) 100%);
        }

        .node-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 0.75rem;
            padding: 1px;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .node-card.unhealthy::before {
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.5), rgba(239, 68, 68, 0.05));
        }

        @keyframes live-pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            50% {
                box-shadow: 0 0 0 4px rgba(16, 185, 129, 0);
            }
        }

        .live-dot {
            animation: live-pulse 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen text-gray-200 font-mono">

<div hx-ext="sse" sse-connect="/api/events" hx-swap="none">
    <div sse-swap="node.joined"></div>
    <div sse-swap="node.updated"></div>
    <div sse-swap="node.left"></div>
</div>

<div class="container mx-auto max-w-7xl p-4 sm:p-6" x-data>

    <header class="flex items-center justify-between gap-4 mb-6 px-5 py-3 rounded-xl bg-gray-900/40 border border-gray-800 backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold tracking-wide text-emerald-400">Hydra Mesh</h1>
            <div class="w-px h-6 bg-gray-700"></div>
            <div class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold tracking-wider">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 live-dot"></div>
                LIVE TOPOLOGY
            </div>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-900/60 border border-gray-800 text-xs text-gray-400">
            <span>Client:</span> <span class="text-gray-200 font-bold">{{ .ClientID }}</span>
        </div>
    </header>

    <section class="bg-gray-900/30 border border-gray-800 rounded-xl p-5 backdrop-blur-sm">
        <div class="flex items-center gap-1 mb-6 border-b border-gray-800">
            <button @click="$store.cluster.activeTab = 'nodes'"
                    :class="$store.cluster.activeTab === 'nodes' ? 'text-emerald-400 border-emerald-400' : 'text-gray-500 border-transparent hover:text-gray-300'"
                    class="px-4 py-2.5 text-sm font-semibold border-b-2 -mb-px transition-colors flex items-center gap-2">
                Nodes <span class="bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded text-[10px]"
                            x-text="$store.cluster.nodesList.length"></span>
            </button>
            <button @click="$store.cluster.activeTab = 'proxies'"
                    :class="$store.cluster.activeTab === 'proxies' ? 'text-emerald-400 border-emerald-400' : 'text-gray-500 border-transparent hover:text-gray-300'"
                    class="px-4 py-2.5 text-sm font-semibold border-b-2 -mb-px transition-colors flex items-center gap-2">
                Proxies <span class="bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded text-[10px]"
                              x-text="$store.cluster.proxiesList.length"></span>
            </button>
        </div>

        <div x-show="$store.cluster.activeTab === 'nodes'" x-transition
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <template x-for="node in $store.cluster.nodesList" :key="node.id">
                <div class="node-card relative rounded-xl p-4 transition-all duration-300"
                     :class="{ 'unhealthy': !node.healthy }">
                    <div class="flex items-center gap-2 mb-2 text-[10px] font-bold uppercase">
                        <div class="w-1.5 h-1.5 rounded-full"
                             :class="node.healthy ? 'bg-emerald-400' : 'bg-red-400'"></div>
                        <span :class="node.healthy ? 'text-emerald-400' : 'text-red-400'"
                              x-text="node.healthy ? 'Healthy' : 'Unhealthy'"></span>
                    </div>
                    <h3 class="text-lg font-bold text-gray-100 mb-3 truncate" x-text="node.id"></h3>
                    <div class="space-y-1 text-[11px] text-gray-400">
                        <div>Private IP: <span class="text-gray-200" x-text="$store.cluster.getPrimaryIP(node)"></span>
                        </div>
                        <template x-if="$store.cluster.getPublicIP(node)">
                            <div>Public IP: <span class="text-emerald-500 font-bold"
                                                  x-text="$store.cluster.getPublicIP(node)"></span></div>
                        </template>
                        <div>Ports: <span class="text-gray-200" x-text="$store.cluster.getAllPorts(node)"></span></div>
                        <div class="pt-2 text-gray-500 italic">Last Seen: <span
                                x-text="$store.cluster.formatLastSeen(node.last_seen)"></span></div>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="$store.cluster.activeTab === 'proxies'" x-cloak x-transition
             class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <template x-for="group in $store.cluster.groupedProxies" :key="group.nodeId">
                <div class="bg-gray-800/30 border border-gray-700/50 rounded-xl p-5 shadow-lg">
                    <h3 class="text-emerald-400 font-bold text-sm mb-4 flex items-center gap-2 border-b border-gray-800 pb-2">
                        NODE: <span class="text-gray-200" x-text="group.nodeId"></span>
                    </h3>
                    <div class="space-y-3">
                        <template x-for="proxy in group.proxies" :key="proxy.address">
                            <div class="bg-gray-900/50 border border-gray-700 rounded-lg p-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-mono text-emerald-300 text-sm" x-text="proxy.address"></span>
                                    <button @click="$store.cluster.testProxy(proxy.address)"
                                            :disabled="$store.cluster.testStates[proxy.address]?.status === 'testing'"
                                            class="px-3 py-1.5 rounded text-[10px] font-bold transition-all"
                                            :class="$store.cluster.testStates[proxy.address]?.status === 'testing' ? 'bg-gray-700' : 'bg-emerald-600 hover:bg-emerald-500 text-white'">
                                        <span x-text="$store.cluster.testStates[proxy.address]?.status === 'testing' ? 'Testing...' : 'Test Tunnel'"></span>
                                    </button>
                                </div>
                                <div x-show="$store.cluster.testStates[proxy.address]" x-transition
                                     class="mt-2 pt-2 border-t border-gray-800 text-[10px] font-mono">
                                    <div x-show="$store.cluster.testStates[proxy.address]?.status === 'success'"
                                         class="text-emerald-400">
                                        ✓ Connected! IP via Proxy: <span class="bg-emerald-900/40 px-1 rounded"
                                                                         x-text="$store.cluster.testStates[proxy.address]?.result"></span>
                                    </div>
                                    <div x-show="$store.cluster.testStates[proxy.address]?.status === 'error'"
                                         class="text-red-400">
                                        ✗ Failed: <span
                                            x-text="$store.cluster.testStates[proxy.address]?.result"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </section>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('cluster', {
            activeTab: 'nodes',
            nodesMap: {},
            proxiesList: [],
            testStates: {},

            async init() {
                await this.refreshAll();
            },

            async refreshAll() {
                try {
                    const [nRes, pRes] = await Promise.all([fetch('/api/nodes'), fetch('/api/proxies')]);
                    if (nRes.ok) {
                        const nodes = await nRes.json();
                        const newMap = {};
                        nodes.forEach(n => newMap[n.id] = n);
                        this.nodesMap = newMap;
                    }
                    if (pRes.ok) this.proxiesList = await pRes.json();
                } catch (e) {
                    console.error("Initial load failed", e);
                }
            },

            get nodesList() {
                return Object.values(this.nodesMap).sort((a, b) => a.id.localeCompare(b.id));
            },

            get groupedProxies() {
                const groups = {};
                this.proxiesList.forEach(p => {
                    if (!groups[p.node_id]) groups[p.node_id] = [];
                    groups[p.node_id].push(p);
                });
                return Object.keys(groups).sort().map(id => ({nodeId: id, proxies: groups[id]}));
            },

            async testProxy(address) {
                this.testStates = {...this.testStates, [address]: {status: 'testing', result: ''}};
                try {
                    const res = await fetch(`/api/proxies/test?address=${encodeURIComponent(address)}`);
                    const data = await res.json();
                    this.testStates = {
                        ...this.testStates, [address]: {
                            status: data.success ? 'success' : 'error',
                            result: data.success ? data.ip : data.error
                        }
                    };
                } catch (e) {
                    this.testStates = {...this.testStates, [address]: {status: 'error', result: e.message}};
                }
            },

            formatLastSeen(ts) {
                if (!ts) return '—';
                return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
            },

            getPrimaryIP(n) {
                return (n.interfaces && n.interfaces[0]) ? n.interfaces[0].private_ip : 'N/A';
            },

            getPublicIP(n) {
                return (n.interfaces && n.interfaces[0]?.public_ip) ? n.interfaces[0].public_ip : null;
            },

            getAllPorts(n) {
                if (!n.interfaces) return '—';
                const ports = n.interfaces.map(i => i.service_port).filter(p => p > 0);
                return ports.length > 0 ? ports.join(', ') : '—';
            }
        });
    });

    document.body.addEventListener('htmx:sseMessage', function (e) {
        const type = e.detail.type;
        if (!type || type === 'message') return;
        const store = Alpine.store('cluster');
        if (type === 'node.left') {
            const nodeData = JSON.parse(e.detail.data);
            const newMap = {...store.nodesMap};
            delete newMap[nodeData.id];
            store.nodesMap = newMap;
        } else {
            store.nodesMap = {...store.nodesMap, [JSON.parse(e.detail.data).id]: JSON.parse(e.detail.data)};
        }
        fetch('/api/proxies').then(r => r.json()).then(data => store.proxiesList = data);
    });
</script>
</body>
</html>
